name: CI

# 只跑「纯逻辑」crate 的单测：它们不需要 Qt、ffmpeg，也不需要编译 GUI。
# GUI 构建、依赖部署与便携包验证由 release.yml 单独完成。
#
# 需要子模块：app 通过路径依赖 gyroflow-src/src/core，cargo 解析工作区时要求该路径存在。

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  logic-tests:
    name: 纯逻辑单测
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: cargo test（tracereel-core / receipt-ocr）
        run: cargo test -p tracereel-core -p receipt-ocr
