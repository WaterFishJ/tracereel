name: Windows package and release

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - '.github/workflows/release.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'app/**'
      - 'tracereel-core/**'
      - 'receipt-ocr/**'
      - 'gyroflow-src'
      - '.gitmodules'
      - 'assets/branding/**'
      - 'build.ps1'
      - 'package.ps1'
      - 'packaging/**'
      - 'ocr/**'
      - 'presets/**'
      - 'LICENSE'
      - 'THIRD-PARTY.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Build and verify Windows x64 portable package
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: '2'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Read version and validate release tag
        id: version
        run: |
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read Cargo metadata.' }
          $version = ($metadata.packages | Where-Object name -eq tracereel).version
          if (-not $version) { throw 'Application version is missing.' }
          if ($env:GITHUB_REF.StartsWith('refs/tags/') -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME must match Cargo version v$version."
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.2'
          arch: win64_msvc2022_64
          cache: true

      - name: Configure Qt and LLVM paths
        run: |
          $qtRoot = Split-Path (Split-Path (Get-Command qmake.exe).Source -Parent) -Parent
          $clangRoot = 'C:\Program Files\LLVM\bin'
          if (-not (Test-Path "$clangRoot/libclang.dll")) { throw 'LLVM libclang.dll is missing.' }
          "TRACEREEL_QT_ROOT=$qtRoot" >> $env:GITHUB_ENV
          "LIBCLANG_PATH=$clangRoot" >> $env:GITHUB_ENV

      - uses: actions/cache@v5
        with:
          path: |
            tools/ffmpeg
            tools/ocr
            target/ocr-downloads
          key: windows-runtime-${{ hashFiles('packaging/setup-ci-ffmpeg.ps1', 'ocr/setup.ps1') }}

      - name: Prepare and validate FFmpeg
        run: ./packaging/setup-ci-ffmpeg.ps1

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target/package-build'
          key: windows-portable-qt-6.8.2
          env-vars: 'CARGO CC CFLAGS CXX CMAKE RUST LIBCLANG TRACEREEL'

      - name: Run logic tests
        run: |
          cargo test --locked --target-dir target/package-build -p tracereel-core -p receipt-ocr
          if ($LASTEXITCODE -ne 0) { throw 'Logic tests failed.' }

      - name: Build and package
        run: ./package.ps1

      - name: Verify extracted portable package
        run: |
          $zip = @(Get-ChildItem dist -Filter '*-portable.zip' -File)
          if ($zip.Count -ne 1) { throw 'Expected exactly one portable ZIP.' }
          ./packaging/verify-package.ps1 -Zip $zip[0].FullName

      - name: Archive corresponding source including Gyroflow
        run: ./packaging/create-source-archive.ps1 -Version '${{ steps.version.outputs.version }}'

      - name: Upload packages and SHA256 files
        uses: actions/upload-artifact@v5
        with:
          name: TraceReel-${{ steps.version.outputs.version }}-windows-x64
          path: |
            dist/*-portable.zip
            dist/*-source.zip
            dist/*.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload verification logs
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: windows-package-diagnostics
          path: |
            target/package-smoke/**/*.log
            target/package-smoke/**/loaded-dependencies.json
          if-no-files-found: ignore

  release:
    name: Publish version tag to GitHub Releases
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: TraceReel-*-windows-x64
          path: release-assets
          merge-multiple: true

      - name: Publish portable package, source and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            flags=()
            if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); fi
            gh release create "$RELEASE_TAG" release-assets/* \
              --verify-tag --title "TraceReel $RELEASE_TAG" --generate-notes "${flags[@]}"
          fi
